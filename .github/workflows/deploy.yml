name: Redirect to the current portfolio

# This repo is the August 2026 version of the portfolio and is no longer built.
# The current site lives at johnculinares.vercel.app, built from Website-Portfolio.
# Pages here serves a redirect so old links do not land on the old design.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./redirect
      - id: deployment
        uses: actions/deploy-pages@v4
